<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*links não visitados*/
        a:link {
            color: #b9c941;
        }
        /*links visitados*/
        a:visited{
            color: brown;
        }
        /*links hover, passa o cursor sobre o link*/
        a:hover{
            color: rgb(255, 0, 0);
        }
        /*links ativos, quando clicados*/
        a:active{
            color: rgb(34, 149, 178);
        }
    </style>
</head>
<body>

    <a href="sadsadsdasd">yt</a> |
    <a href="https://teams.microsoft.com/v2/">teams</a> |
    <a href="https://www.udemy.com/course/web-completo/learn/lecture/10213554#announcements">udemy</a>

    
</body>
</html>
